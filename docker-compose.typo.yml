# v5 original-text detector + MacBERT candidates + independent CEC3 spelling check.
services:
  app:
    environment:
      TYPO_SERVICE_URL: http://xtjs-typo:8090
      TYPO_CLIENT_TIMEOUT_SECONDS: 780
      TYPO_CHECK_ENABLED: "true"
      TYPO_CHECK_VISIBLE: "true"
  typo:
    build:
      context: .
      dockerfile: Dockerfile.typo-v5
    image: xtjs-typo:original-detector-v5-20260925
    container_name: xtjs-typo
    init: true
    entrypoint: ["python", "-m", "typo_runtime.manager"]
    environment:
      PYTHONPATH: /runtime
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TYPO_PIPELINE_VERSION: duplicate-typo-original-detector-v5
      TYPO_MODEL_PATH: /models/current
      TYPO_CEC3_MODEL_PATH: /models/cec3
      TYPO_DETECTOR_MODEL_PATH: /models/detector
      TYPO_V5_FONT_PATH: /models/v5-assets/NotoSansSC-wght.ttf
      TYPO_CACHE_PATH: /cache/checks.sqlite
      TYPO_IDLE_SECONDS: "1800"
      TYPO_DETECTOR_THRESHOLD: ${TYPO_DETECTOR_THRESHOLD:-0.99}
      TYPO_GLYPH_THRESHOLD: ${TYPO_GLYPH_THRESHOLD:-0.75}
      TYPO_V5_EVAL_TRACE: "false"
      TYPO_DEVICE: ${TYPO_DEVICE:-auto}
      TYPO_REQUEST_SECONDS: "120"
      TYPO_STARTUP_SECONDS: "600"
    volumes:
      - ./app/service/typo_runtime:/runtime/typo_runtime:ro
      - ./models/typo/${TYPO_ACCEPTED_MODEL:-macbert4csc-base-chinese}:/models/current:ro
      - ./models/typo/ChineseErrorCorrector3-4B:/models/cec3:ro
      - /data/xtjs-models/typo-training/v5/detector-public-v1:/models/detector:ro
      - /data/xtjs-models/typo-training/v5/assets:/models/v5-assets:ro
      - typo_v5_cache:/cache
    shm_size: 1gb
    mem_limit: 24g
    cpus: 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  typo_v5_cache:
