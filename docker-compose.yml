services:
  # 主应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-xtjs:release-ee8ceab
    container_name: project-xtjs
    ports:
      - "8080:8080"
    environment:
      # —— 日志：JSON 结构化，按天/大小滚动，保留 90 天 ——
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-/app/logs}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-90}
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-209715200}
      # 数据库已迁至阿里云 RDS（实际密码在 .env 的 DATABASE_URL 中配置）
      - DATABASE_URL=${DATABASE_URL:-postgresql://xtjs_admin:CHANGE_ME@pgm-bp1gk147oe9t4h05.pg.rds.aliyuncs.com:5432/xtjs_db}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-oss-cn-hangzhou-internal.aliyuncs.com}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-update-file}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_REGION=${MINIO_REGION:-}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-}
      - MINIO_ALLOWED_EXTENSIONS=${MINIO_ALLOWED_EXTENSIONS:-pdf}
      # —— 认证与账号安全（务必在宿主机 .env 覆盖密钥与初始管理员口令）——
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_ME_IN_ENV_use_a_long_random_secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      - AUTH_MAX_FAILED_ATTEMPTS=${AUTH_MAX_FAILED_ATTEMPTS:-5}
      - AUTH_LOCK_MINUTES=${AUTH_LOCK_MINUTES:-15}
      - AUTH_PASSWORD_MIN_LENGTH=${AUTH_PASSWORD_MIN_LENGTH:-8}
      - AUTH_INITIAL_ADMIN_USERNAME=${AUTH_INITIAL_ADMIN_USERNAME:-admin}
      - AUTH_INITIAL_ADMIN_PASSWORD=${AUTH_INITIAL_ADMIN_PASSWORD:-}
      - PADDLE_OCR_DEVICE=${PADDLE_OCR_DEVICE:-gpu:0}
      - PADDLE_OCR_DEVICE_POOL=${PADDLE_OCR_DEVICE_POOL:-auto}
      - PADDLE_OCR_MAX_INFLIGHT_PER_DEVICE=${PADDLE_OCR_MAX_INFLIGHT_PER_DEVICE:-1}
      - PADDLE_OCR_MULTI_GPU_LOG_SCHEDULING=${PADDLE_OCR_MULTI_GPU_LOG_SCHEDULING:-false}
      - PADDLE_OCR_FALLBACK_TO_CPU=${PADDLE_OCR_FALLBACK_TO_CPU:-true}
      - PADDLE_OCR_USE_DOC_ORIENTATION=${PADDLE_OCR_USE_DOC_ORIENTATION:-true}
      - PADDLE_OCR_USE_DOC_UNWARPING=${PADDLE_OCR_USE_DOC_UNWARPING:-true}
      - PADDLE_VL_PIPELINE_VERSION=${PADDLE_VL_PIPELINE_VERSION:-v1.5}
      - PADDLE_VL_BACKEND=${PADDLE_VL_BACKEND:-native}
      - PADDLE_VL_SERVER_URL=${PADDLE_VL_SERVER_URL:-}
      - PADDLE_VL_API_MODEL_NAME=${PADDLE_VL_API_MODEL_NAME:-}
      - PADDLE_VL_MAX_PIXELS=${PADDLE_VL_MAX_PIXELS:-}
      - PADDLE_VL_USE_LAYOUT_DETECTION=${PADDLE_VL_USE_LAYOUT_DETECTION:-true}
      - PADDLE_VL_USE_CHART_RECOGNITION=${PADDLE_VL_USE_CHART_RECOGNITION:-false}
      - PADDLE_VL_USE_SEAL_RECOGNITION=${PADDLE_VL_USE_SEAL_RECOGNITION:-true}
      - PADDLE_VL_USE_SIGNATURE_RECOGNITION=${PADDLE_VL_USE_SIGNATURE_RECOGNITION:-true}
      - PADDLE_VL_USE_OCR_FOR_IMAGE_BLOCK=${PADDLE_VL_USE_OCR_FOR_IMAGE_BLOCK:-true}
      - PADDLE_VL_FORMAT_BLOCK_CONTENT=${PADDLE_VL_FORMAT_BLOCK_CONTENT:-false}
      - PADDLE_VL_MERGE_LAYOUT_BLOCKS=${PADDLE_VL_MERGE_LAYOUT_BLOCKS:-false}
      - PADDLE_VL_USE_QUEUES=${PADDLE_VL_USE_QUEUES:-false}
      - PADDLE_VL_RESTRUCTURE_PAGES=${PADDLE_VL_RESTRUCTURE_PAGES:-true}
      - OCR_PROGRESS_ENABLED=${OCR_PROGRESS_ENABLED:-true}
      - OCR_PROGRESS_BAR_WIDTH=${OCR_PROGRESS_BAR_WIDTH:-24}
      - OCR_PROGRESS_KEEP_RECENT_UPDATES=${OCR_PROGRESS_KEEP_RECENT_UPDATES:-12}
      - OCR_PROGRESS_HEARTBEAT_SECONDS=${OCR_PROGRESS_HEARTBEAT_SECONDS:-10.0}
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=${PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK:-true}
      - OCR_STORAGE_ROOT=${OCR_STORAGE_ROOT:-/app/.ocr_runtime}
      - PADDLE_PDX_CACHE_HOME=${PADDLE_PDX_CACHE_HOME:-/app/.ocr_runtime/paddlex-cache}
      - OCR_RUNTIME_TEMP_DIR=${OCR_RUNTIME_TEMP_DIR:-/app/.ocr_runtime/runtime-tmp}
      - CONSISTENCY_EMBEDDING_MODEL_PATH=${CONSISTENCY_EMBEDDING_MODEL_PATH:-/app/models/bge-small-zh-v1.5}
      - XTJS_CACHE_ENABLED=${XTJS_CACHE_ENABLED:-true}
      - XTJS_CACHE_REQUIRED=${XTJS_CACHE_REQUIRED:-true}
      # 缓存已迁至云数据库 Redis（实际账号密码在 .env 中配置）
      - XTJS_CACHE_REDIS_URL=${XTJS_CACHE_REDIS_URL:-redis://xtjs_redis:CHANGE_ME@r-bp1ujxecepi9bv97wu.redis.rds.aliyuncs.com:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://xtjs_redis:CHANGE_ME@r-bp1ujxecepi9bv97wu.redis.rds.aliyuncs.com:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://xtjs_redis:CHANGE_ME@r-bp1ujxecepi9bv97wu.redis.rds.aliyuncs.com:6379/0}
      - XTJS_CACHE_KEY_PREFIX=${XTJS_CACHE_KEY_PREFIX:-xtjs}
      - XTJS_CACHE_PROJECT_LIST_TTL_SECONDS=${XTJS_CACHE_PROJECT_LIST_TTL_SECONDS:-30}
      - XTJS_CACHE_PROJECT_DETAIL_TTL_SECONDS=${XTJS_CACHE_PROJECT_DETAIL_TTL_SECONDS:-120}
      - XTJS_CACHE_PROJECT_RESULTS_TTL_SECONDS=${XTJS_CACHE_PROJECT_RESULTS_TTL_SECONDS:-300}
      - XTJS_CACHE_OCR_STATUS_TTL_SECONDS=${XTJS_CACHE_OCR_STATUS_TTL_SECONDS:-3}
      - XTJS_CACHE_PREVIEW_META_TTL_SECONDS=${XTJS_CACHE_PREVIEW_META_TTL_SECONDS:-604800}
      - XTJS_CACHE_PREVIEW_OBJECT_PREFIX=${XTJS_CACHE_PREVIEW_OBJECT_PREFIX:-cache/previews}
      - XTJS_CACHE_SCAN_BATCH_SIZE=${XTJS_CACHE_SCAN_BATCH_SIZE:-500}
    volumes:
      - ocr_runtime:/app/.ocr_runtime
      - app_logs:/app/logs
    networks:
      - app_network
    restart: always

networks:
  app_network:
    driver: bridge

volumes:
  ocr_runtime:
  app_logs:
